<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear enlace de invitación</title>
    <style>
        :root {
            --riffle-green: #53583E;
            --timberwood: #DDDBD7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            background: var(--riffle-green);
            color: var(--timberwood);
            font-family: Georgia, "Times New Roman", serif;
        }

        .layout {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 2.5rem 3rem;
            width: 100%;
            max-width: 56rem;
        }

        form {
            width: min(28rem, 100%);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            text-align: center;
        }

        label,
        .preview-label {
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1px solid var(--timberwood);
            background: transparent;
            color: var(--timberwood);
            font: inherit;
            font-size: 1.15rem;
            text-align: center;
        }

        input::placeholder {
            color: color-mix(in srgb, var(--timberwood) 55%, transparent);
        }

        input:focus {
            outline: 1px solid var(--timberwood);
            outline-offset: 2px;
        }

        button {
            padding: 0.7rem 1.5rem;
            border: 1px solid var(--timberwood);
            background: transparent;
            color: var(--timberwood);
            font: inherit;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
        }

        button:hover,
        button:focus-visible {
            background: color-mix(in srgb, var(--timberwood) 12%, transparent);
        }

        #status,
        #url {
            margin: 0;
            min-height: 1.4em;
        }

        #url {
            word-break: break-all;
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .preview-frame {
            width: 390px;
            height: 700px;
            max-width: 100%;
            border: 1px solid var(--timberwood);
            border-radius: 1.25rem;
            overflow: hidden;
            background: #000;
        }

        .preview-frame iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        @media (max-width: 480px) {
            .preview-frame {
                height: 560px;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <form id="form">
            <label for="para">Invitados / para</label>
            <input id="para" name="para" type="text" autocomplete="name" placeholder="Familia García">
            <button type="submit">Copiar enlace</button>
            <p id="status" role="status"></p>
            <p id="url"></p>
        </form>
        <div class="preview">
            <p class="preview-label">Así lo ven</p>
            <div class="preview-frame">
                <iframe id="preview" title="Vista previa de la invitación"></iframe>
            </div>
        </div>
    </div>
    <script>
        const ORIGIN = "https://bodanachoysantiago.com.ar";

        const form = document.getElementById("form");
        const input = document.getElementById("para");
        const status = document.getElementById("status");
        const urlOut = document.getElementById("url");
        const preview = document.getElementById("preview");

        let lastPreview = "";
        let previewTimer = 0;

        function inviteUrl(name) {
            const trimmed = name.trim();
            return trimmed
                ? `${ORIGIN}/?para=${encodeURIComponent(trimmed)}`
                : `${ORIGIN}/`;
        }

        function setPreview(name) {
            const url = inviteUrl(name);
            if (url === lastPreview) return;
            lastPreview = url;
            preview.src = url;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const name = input.value.trim();
            if (!name) {
                urlOut.textContent = "";
                status.textContent = "Escribe un nombre.";
                input.focus();
                setPreview("");
                return;
            }

            const url = inviteUrl(name);
            urlOut.textContent = url;
            setPreview(name);
            let copied = false;
            try {
                await navigator.clipboard.writeText(url);
                copied = true;
            } catch (error) {
                const field = document.createElement("textarea");
                field.value = url;
                field.setAttribute("readonly", "");
                field.style.position = "fixed";
                field.style.left = "-9999px";
                document.body.appendChild(field);
                field.select();
                copied = document.execCommand("copy");
                field.remove();
            }
            status.textContent = copied
                ? "Enlace copiado."
                : "No se pudo copiar. Copia el enlace de abajo.";
        });

        input.addEventListener("input", () => {
            clearTimeout(previewTimer);
            previewTimer = setTimeout(() => setPreview(input.value), 400);
        });

        setPreview(input.value);
    </script>
</body>
</html>
