<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear enlace de invitación</title>
    <style>
        :root {
            --riffle-green: #53583E;
            --timberwood: #DDDBD7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            background: var(--riffle-green);
            color: var(--timberwood);
            font-family: Georgia, "Times New Roman", serif;
        }

        form {
            width: min(28rem, 100%);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            text-align: center;
        }

        label {
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1px solid var(--timberwood);
            background: transparent;
            color: var(--timberwood);
            font: inherit;
            font-size: 1.15rem;
            text-align: center;
        }

        input::placeholder {
            color: color-mix(in srgb, var(--timberwood) 55%, transparent);
        }

        input:focus {
            outline: 1px solid var(--timberwood);
            outline-offset: 2px;
        }

        button {
            padding: 0.7rem 1.5rem;
            border: 1px solid var(--timberwood);
            background: transparent;
            color: var(--timberwood);
            font: inherit;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
        }

        button:hover,
        button:focus-visible {
            background: color-mix(in srgb, var(--timberwood) 12%, transparent);
        }

        #status,
        #url {
            margin: 0;
            min-height: 1.4em;
        }

        #url {
            word-break: break-all;
            font-size: 0.9rem;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <form id="form">
        <label for="para">Invitados / para</label>
        <input id="para" name="para" type="text" autocomplete="name" placeholder="Familia García">
        <button type="submit">Copiar enlace</button>
        <p id="status" role="status"></p>
        <p id="url"></p>
    </form>
    <script>
        const ORIGIN = "http://localhost:5500";
        // Production: https://bodanachoysantiago.com.ar

        const form = document.getElementById("form");
        const input = document.getElementById("para");
        const status = document.getElementById("status");
        const urlOut = document.getElementById("url");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const name = input.value.trim();
            if (!name) {
                urlOut.textContent = "";
                status.textContent = "Escribe un nombre.";
                input.focus();
                return;
            }

            const url = `${ORIGIN}/?para=${encodeURIComponent(name)}`;
            urlOut.textContent = url;
            let copied = false;
            try {
                await navigator.clipboard.writeText(url);
                copied = true;
            } catch (error) {
                const field = document.createElement("textarea");
                field.value = url;
                field.setAttribute("readonly", "");
                field.style.position = "fixed";
                field.style.left = "-9999px";
                document.body.appendChild(field);
                field.select();
                copied = document.execCommand("copy");
                field.remove();
            }
            status.textContent = copied
                ? "Enlace copiado."
                : "No se pudo copiar. Copia el enlace de abajo.";
        });
    </script>
</body>
</html>
